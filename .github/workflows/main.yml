name: Build iOS Dynamic Library

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Extract Project Zip
      run: |
        unzip "FUCK S0N_MX BY HMOOD.zip" -d ./

    - name: Build Project
      run: |
        xcodebuild -project HMOOD_FUCK_MAX.xcodeproj -scheme HMOOD_FUCK_MAX -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO clean build
